<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Page not found · ART3RY</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#060810;--bg-card:#090c1b;--red:#e63946;--red-glow:rgba(230,57,70,.3);--border:rgba(255,255,255,.08);--text:#dde1f0;--muted:#6a7490;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(88,28,135,.09) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 100%,rgba(6,214,160,.05) 0%,transparent 55%)}
a{color:inherit;text-decoration:none}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;text-align:center;max-width:480px;margin:20px}
.code{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--red);margin-bottom:14px}
h1{font-size:34px;font-weight:900;letter-spacing:-.03em;color:#fff;margin-bottom:12px}
p{font-size:15px;color:var(--muted);margin-bottom:28px}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:12px 28px;border-radius:10px;box-shadow:0 0 24px var(--red-glow)}
.btn:hover{background:#ff4d5a;transition:background .15s}
</style>
</head>
<body>
<div class="card">
  <div class="code">ERROR · 404</div>
  <h1>Page not found.</h1>
  <p>This page doesn't exist — or it moved. The system noticed; you were never going to hit a dead end for long.</p>
  <a class="btn" href="/">Back to art3ry.com</a>
</div>
</body>
</html>
